[project]
name = "airline-voice-customer-assistant"
version = "0.1.0"
description = "A voice reservations demo with server-owned LangGraph workflows"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.142.2",
    "google-genai==2.28.0",
    "httpx==0.28.1",
    "langgraph==1.2.14",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[tool.fastapi]
entrypoint = "app:app"


[tool.uv]
package = false
