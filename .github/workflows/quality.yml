name: Quality and security
on:
  push:
    branches: [main, enterprise-readiness]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.9.13'
      - run: npm ci --ignore-scripts
      - run: uv sync --frozen
      - run: npm run build
      - run: npm test
      - run: python -m compileall -q app.py security.py ops.py telemetry.py scripts test
      - name: Verify hashed container dependencies match the lock
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header -o requirements.lock
          git diff --exit-code -- requirements.lock

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.9.13'
          python-version: '3.13'
      - run: npm audit --audit-level=high
      - run: uvx --from pip-audit==2.10.1 pip-audit --require-hashes --no-deps -r requirements.lock

